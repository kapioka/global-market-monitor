name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            project/requirements.txt
            project/requirements-lock.txt
            project/requirements-dev.txt
            requirements-security.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r project/requirements-lock.txt
          python -m pip install -r project/requirements-dev.txt
          python -m pip install -r requirements-security.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Run ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Run black check
        shell: pwsh
        run: python -m black --check .

      - name: Run mypy
        shell: pwsh
        run: python -m mypy .

      - name: Run dependency audit
        shell: pwsh
        run: .\scripts\audit_python_dependencies.ps1 -Python "python"

      - name: Run security audit
        shell: pwsh
        run: |
          $expectedTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          .\scripts\security_audit.ps1 -Python "python" -ExpectedTag $expectedTag -Strict

      - name: Check release package dry run
        shell: pwsh
        run: python scripts/create_release_package.py --dry-run

      - name: Create release package
        shell: pwsh
        run: python scripts/create_release_package.py

      - name: Verify release package
        shell: pwsh
        run: python scripts/verify_release_package.py --latest-dir release --expected-commit ${{ github.sha }}

      - name: Upload verified source package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: global-market-monitor-source-${{ github.ref_name }}
          path: release/global-market-monitor-*-source.zip
          if-no-files-found: error
