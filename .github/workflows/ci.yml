name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            project/requirements.txt
            project/requirements-dev.txt
            requirements-security.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r project/requirements-dev.txt
          python -m pip install -r requirements-security.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Run ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Run black check
        shell: pwsh
        run: python -m black --check .

      - name: Run mypy
        shell: pwsh
        run: python -m mypy .

      - name: Run dependency audit
        shell: pwsh
        run: .\scripts\audit_python_dependencies.ps1 -Python "python"

      - name: Run security audit
        shell: pwsh
        run: .\scripts\security_audit.ps1 -Python "python" -ExpectedTag "" -Strict

      - name: Check release package dry run
        shell: pwsh
        run: python scripts/create_release_package.py --dry-run

      - name: Create release package
        shell: pwsh
        run: python scripts/create_release_package.py

      - name: Verify release package
        shell: pwsh
        run: python scripts/verify_release_package.py --latest-dir release --expected-commit ${{ github.sha }}
